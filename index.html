<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평균 활용 경매 게임</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX CSS & JS for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        @font-face {
            font-family: 'Pretendard-Regular';
            src: url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');
            font-weight: 400;
        }
        body { font-family: 'Pretendard-Regular', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 메인 앱 컨테이너 -->
    <div id="app" class="flex-grow flex flex-col relative w-full h-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- 자바스크립트를 통해 화면이 여기에 렌더링 됩니다. -->
    </div>

    <!-- 토스트 알림창 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-8 py-4 rounded-full shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-xl font-bold">
        알림 메시지
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, writeBatch, collection, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =====================================================================
        // [중요] 깃허브에 올리실 때는 아래 설정값을 본인의 Firebase 프로젝트 설정으로 변경해야 합니다!
        // Firebase Console -> 프로젝트 설정 -> 웹 앱 추가 후 나오는 config 정보
        // =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyDTJw9QJ93KRajfZ4uZ9d1Qtn_RjttZJJ8",
  authDomain: "blind-average-auction.firebaseapp.com",
  databaseURL: "https://blind-average-auction-default-rtdb.firebaseio.com",
  projectId: "blind-average-auction",
  storageBucket: "blind-average-auction.firebasestorage.app",
  messagingSenderId: "596955232912",
  appId: "1:596955232912:web:8683c5fcf358ad7c10b615"
};

        // 전역 상태 변수
        let appInstance, db;
        let isFirebaseReady = false;
        let currentMode = 'select'; // 'select' (초기화면), 'student', 'teacher'
        let myGroupName = null;
        
        const INITIAL_BALANCE = 1000; // 초기 예산: 1000만 원
        const TOTAL_ROUNDS = 5;       // 총 라운드 수
        
        let globalGameState = { round: 1, phase: 'bidding' };
        let allGroupsData = [];

        // DOM Elements
        const appContainer = document.getElementById('app');
        const toastEl = document.getElementById('toast');

        function showToast(message, isError = false) {
            toastEl.textContent = message;
            toastEl.style.backgroundColor = isError ? '#ef4444' : '#111827';
            toastEl.style.opacity = '1';
            setTimeout(() => { toastEl.style.opacity = '0'; }, 3000);
        }

        function formatMoney(num) {
            return Number(num).toLocaleString('ko-KR');
        }

        function renderMath() {
            if (window.renderMathInElement) {
                renderMathInElement(appContainer, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        try {
            // Firebase 초기화 시도
            appInstance = initializeApp(firebaseConfig);
            db = getFirestore(appInstance);
            isFirebaseReady = firebaseConfig.projectId !== "YOUR_PROJECT_ID";
        } catch (e) {
            console.error("Firebase 초기화 에러 (정상 - 설정값 미입력):", e);
            isFirebaseReady = false;
        }

        function setupFirebaseListeners() {
            if (!isFirebaseReady) return;

            // 1. 게임 상태(라운드, 진행상황) 실시간 구독
            const gameStateRef = doc(db, "game", "state");
            onSnapshot(gameStateRef, (docSnap) => {
                if (docSnap.exists()) {
                    globalGameState = docSnap.data();
                } else {
                    // 문서가 없으면 초기화
                    setDoc(gameStateRef, { round: 1, phase: 'bidding' });
                }
                renderUI();
            });

            // 2. 모든 모둠 데이터 실시간 구독
            const groupsColRef = collection(db, "groups");
            onSnapshot(groupsColRef, (snapshot) => {
                const groups = [];
                snapshot.forEach((docSnap) => {
                    groups.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                // 이름순 정렬
                groups.sort((a, b) => (a.id || '').localeCompare(b.id || '', 'ko'));
                allGroupsData = groups;
                renderUI();
            });
        }

        window.handleJoinGroup = async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('groupNameInput').value.trim();
            if (!nameInput) return showToast("모둠 이름을 입력하세요.", true);
            
            myGroupName = nameInput;
            currentMode = 'student';
            renderUI();
            showToast(`'${myGroupName}' 모둠으로 접속했습니다.`);

            if (isFirebaseReady) {
                // 내 모둠 데이터가 없으면 초기화, 있으면 기존 유지(merge)
                const myGroupRef = doc(db, "groups", myGroupName);
                await setDoc(myGroupRef, {
                    balance: INITIAL_BALANCE,
                    lastUpdated: Date.now() // 타임스탬프를 갱신하여 문서 생성을 강제함
                }, { merge: true });
            }
        };

        window.handleBidSubmit = async (e) => {
            e.preventDefault();
            const bidInput = parseInt(document.getElementById('bidInput').value, 10);
            const myGroupData = allGroupsData.find(g => g.id === myGroupName) || { balance: INITIAL_BALANCE };
            
            if (isNaN(bidInput) || bidInput < 0) return showToast("올바른 금액을 입력하세요.", true);
            if (bidInput > myGroupData.balance) return showToast("예산을 초과할 수 없습니다!", true);

            const existingBids = myGroupData.bids || {};
            const newBids = { ...existingBids, [globalGameState.round]: bidInput };
            const newBalance = myGroupData.balance - bidInput;

            if (isFirebaseReady) {
                await setDoc(doc(db, "groups", myGroupName), {
                    balance: newBalance,
                    bids: newBids
                }, { merge: true });
                showToast("입찰이 완료되었습니다!");
            }
        };

        window.handleTeacherLogin = () => {
            const pw = prompt("관리자 비밀번호를 입력하세요.");
            if (pw === '1234') { // 교사 비밀번호
                currentMode = 'teacher';
                renderUI();
                showToast("교사 모드로 접속되었습니다.");
            } else if (pw !== null) {
                showToast("비밀번호가 틀렸습니다.", true);
            }
        };

        window.handleRevealResults = async () => {
            if (isFirebaseReady) {
                await setDoc(doc(db, "game", "state"), { ...globalGameState, phase: 'revealed' });
                showToast("결과가 학생 화면에 공개되었습니다.");
            }
        };

        window.handleNextRound = async () => {
            if (globalGameState.round >= TOTAL_ROUNDS) return showToast("마지막 라운드입니다.");
            if (isFirebaseReady) {
                await setDoc(doc(db, "game", "state"), { round: globalGameState.round + 1, phase: 'bidding' });
                showToast("다음 라운드를 시작합니다.");
            }
        };

        window.handleResetGame = async () => {
            if (!confirm("모든 모둠의 정보와 돈이 초기화됩니다. 계속하시겠습니까?")) return;
            if (isFirebaseReady) {
                // 게임 상태 리셋
                await setDoc(doc(db, "game", "state"), { round: 1, phase: 'bidding' });
                // 모든 그룹 리셋
                const batch = writeBatch(db);
                allGroupsData.forEach(group => {
                    batch.update(doc(db, "groups", group.id), { balance: INITIAL_BALANCE, bids: {} });
                });
                await batch.commit();
                showToast("게임이 초기화되었습니다.");
            }
        };

        function getNeedsSetupView() {
            return `
                <div class="flex-grow flex items-center justify-center fade-in">
                    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-2xl text-center border-t-8 border-red-500">
                        <h1 class="text-3xl font-bold text-red-600 mb-6">Firebase 설정이 필요합니다 ⚠️</h1>
                        <p class="text-lg text-gray-700 mb-4 text-left">소스 코드의 <code class="bg-gray-100 text-red-500 px-2 py-1 rounded">firebaseConfig</code> 부분에 선생님의 Firebase 프로젝트 정보를 붙여넣어 주셔야 데이터베이스가 작동합니다.</p>
                        <p class="text-md text-gray-500 mb-8 text-left">※ GitHub Pages에 배포하시려면 반드시 본인의 Firebase 설정이 필요합니다.</p>
                        <button onclick="location.reload()" class="bg-gray-800 text-white px-8 py-3 rounded-xl font-bold hover:bg-gray-700">설정 후 새로고침</button>
                    </div>
                </div>
            `;
        }

        function getSelectView() {
            return `
                <div class="flex-grow flex items-center justify-center fade-in">
                    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-3xl text-center">
                        <h1 class="text-5xl font-black text-gray-800 mb-4 tracking-tight">평균 경매 게임</h1>
                        <p class="text-xl text-gray-500 mb-12">접속 방식을 선택해 주세요</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <!-- 학생용 패널 -->
                            <div class="bg-blue-50 p-8 rounded-2xl border-2 border-blue-200 hover:shadow-xl transition-all">
                                <div class="text-5xl mb-4">🎓</div>
                                <h2 class="text-2xl font-bold text-blue-900 mb-6">학생 모드</h2>
                                <form onsubmit="handleJoinGroup(event)" class="space-y-4">
                                    <input type="text" id="groupNameInput" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-xl text-center focus:ring-4 focus:ring-blue-200" placeholder="모둠 이름 입력 (예: 1모둠)" required autocomplete="off">
                                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-xl shadow-md transition-all">입장하기</button>
                                </form>
                            </div>

                            <!-- 교사용 패널 -->
                            <div class="bg-gray-50 p-8 rounded-2xl border-2 border-gray-200 hover:shadow-xl transition-all flex flex-col justify-center">
                                <div class="text-5xl mb-4">👨‍🏫</div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-6">교사(진행자) 모드</h2>
                                <p class="text-gray-500 mb-6">모든 모둠의 입찰 현황을 확인하고<br>게임을 진행합니다.</p>
                                <button onclick="handleTeacherLogin()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-xl text-xl shadow-md transition-all">교사로 로그인</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getStudentView() {
            const currentRound = globalGameState.round;
            const currentPhase = globalGameState.phase;
            const myGroupData = allGroupsData.find(g => g.id === myGroupName) || { balance: INITIAL_BALANCE, bids: {} };
            const bids = myGroupData.bids || {};
            const hasBid = bids[currentRound] !== undefined;

            let contentHTML = '';

            if (currentPhase === 'bidding') {
                if (hasBid) {
                    contentHTML = `
                        <div class="bg-gray-50 rounded-2xl p-10 text-center border border-gray-200 mt-8">
                            <div class="text-6xl mb-4">✅</div>
                            <h2 class="text-3xl font-bold text-gray-800 mb-2">${currentRound}라운드 제출 완료!</h2>
                            <p class="text-xl text-gray-600">제출액: <strong class="text-blue-600 text-2xl">${formatMoney(bids[currentRound])}만 원</strong></p>
                            <p class="mt-8 text-gray-500 font-medium">선생님이 결과를 공개할 때까지 기다려주세요...</p>
                        </div>
                    `;
                } else {
                    contentHTML = `
                        <form onsubmit="handleBidSubmit(event)" class="bg-white rounded-3xl p-8 shadow-xl border border-gray-100 mt-8 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                            <label class="block text-gray-800 font-bold mb-6 text-2xl text-center">얼마를 입찰하시겠습니까?</label>
                            <div class="relative max-w-md mx-auto mb-8">
                                <input type="number" id="bidInput" class="w-full px-6 py-5 bg-gray-50 border-2 border-gray-300 rounded-xl text-3xl font-black text-right text-gray-800 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100" placeholder="0" min="0" max="${myGroupData.balance}" required>
                                <span class="absolute right-6 top-1/2 transform -translate-y-1/2 text-xl text-gray-500 font-bold">만 원</span>
                            </div>
                            <button type="submit" class="w-full max-w-md mx-auto block bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-5 rounded-xl text-2xl shadow-lg transition-all transform hover:-translate-y-1">
                                확정 및 제출하기
                            </button>
                        </form>
                    `;
                }
            } else { // revealed
                contentHTML = `
                    <div class="bg-indigo-50 rounded-3xl p-10 text-center border-4 border-indigo-200 mt-8">
                        <div class="text-6xl mb-6 animate-bounce">🎉</div>
                        <h2 class="text-4xl font-black text-indigo-900 mb-4">결과가 공개되었습니다!</h2>
                        <p class="text-2xl text-indigo-700">앞 화면(교사 화면)을 주목해 주세요.</p>
                    </div>
                `;
            }

            return `
                <div class="flex-grow flex flex-col fade-in max-w-3xl mx-auto w-full pt-8">
                    <div class="bg-white rounded-3xl p-6 shadow-md border border-gray-200 flex justify-between items-center mb-4">
                        <div>
                            <span class="text-gray-400 font-bold text-sm">소속 모둠</span>
                            <div class="text-3xl font-black text-gray-800">${myGroupName}</div>
                        </div>
                        <div class="text-right">
                            <span class="text-gray-400 font-bold text-sm">사용 가능 예산</span>
                            <div class="text-4xl font-black ${myGroupData.balance > 0 ? 'text-green-600' : 'text-red-500'}">${formatMoney(myGroupData.balance)}<span class="text-2xl">만원</span></div>
                        </div>
                    </div>
                    <div class="text-center">
                        <span class="inline-block bg-blue-100 text-blue-800 font-black px-6 py-2 rounded-full text-lg border border-blue-200">현재 ${currentRound} / ${TOTAL_ROUNDS} 라운드</span>
                    </div>
                    ${contentHTML}
                </div>
            `;
        }

        function getTeacherView() {
            const currentRound = globalGameState.round;
            const isRevealed = globalGameState.phase === 'revealed';

            let bidsThisRound = [];
            let sumBids = 0;
            
            allGroupsData.forEach(g => {
                const bids = g.bids || {};
                const bidAmt = bids[currentRound] !== undefined ? Number(bids[currentRound]) : null;
                bidsThisRound.push({ name: g.id, bid: bidAmt });
                if (bidAmt !== null) sumBids += bidAmt;
            });

            const numBidders = bidsThisRound.filter(g => g.bid !== null).length;
            const average = numBidders > 0 ? Math.round(sumBids / numBidders) : 0;

            let boardHTML = '';
            
            if (isRevealed) {
                const sortedBids = [...bidsThisRound].sort((a, b) => (b.bid ?? -1) - (a.bid ?? -1));
                boardHTML = `
                    <div class="bg-white rounded-3xl p-8 shadow-2xl border-2 border-indigo-200 mb-8 text-center bg-gradient-to-br from-white to-indigo-50">
                        <h3 class="text-2xl text-gray-600 font-bold mb-4">제출된 평균 가격 ($m$)</h3>
                        <div class="text-3xl text-gray-500 mb-6 font-medium">$$m = \\frac{${formatMoney(sumBids)}}{${numBidders}} \\text{ (모둠수)}$$</div>
                        <div class="text-7xl font-black text-indigo-700 drop-shadow-md py-4">${formatMoney(average)} <span class="text-4xl">만 원</span></div>
                    </div>
                    
                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
                        <table class="min-w-full text-center">
                            <thead class="bg-gray-800 text-white font-bold text-xl">
                                <tr>
                                    <th class="py-4 px-6">모둠명</th>
                                    <th class="py-4 px-6">입찰액 ($x$)</th>
                                    <th class="py-4 px-6 bg-indigo-900">평균과의 차이 ($|x - m|$)</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200 text-lg">
                                ${sortedBids.map(g => {
                                    if (g.bid === null) return `<tr class="bg-gray-50 text-gray-400"><td class="py-4 font-bold">${g.name}</td><td colspan="2" class="py-4">제출 안함</td></tr>`;
                                    const diff = Math.abs(g.bid - average);
                                    return `
                                        <tr class="hover:bg-gray-50">
                                            <td class="py-4 font-black text-gray-700">${g.name}</td>
                                            <td class="py-4 font-bold">${formatMoney(g.bid)}</td>
                                            <td class="py-4 font-black text-indigo-600 text-xl">$$|${formatMoney(g.bid)} - ${formatMoney(average)}| = ${formatMoney(diff)}$$</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                boardHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 mt-8">
                        ${bidsThisRound.map(g => `
                            <div class="bg-white rounded-2xl p-6 shadow-md border-b-4 ${g.bid !== null ? 'border-green-500' : 'border-gray-200'} flex flex-col items-center justify-center h-40 transition-all">
                                <div class="text-2xl font-black mb-4 ${g.bid !== null ? 'text-green-800' : 'text-gray-600'}">${g.name}</div>
                                ${g.bid !== null 
                                    ? `<span class="px-5 py-2 bg-green-100 text-green-700 rounded-full font-bold">제출 완료 ✅</span>`
                                    : `<span class="px-5 py-2 bg-gray-100 text-gray-500 rounded-full font-bold animate-pulse">고민 중... ⏳</span>`
                                }
                            </div>
                        `).join('')}
                        ${bidsThisRound.length === 0 ? `<div class="col-span-full text-center text-gray-500 py-10 text-xl">아직 접속한 모둠이 없습니다. 학생들에게 링크를 안내해주세요.</div>` : ''}
                    </div>
                `;
            }

            return `
                <div class="flex-grow flex flex-col fade-in w-full">
                    <!-- 교사용 상단 컨트롤 바 -->
                    <div class="bg-gray-900 text-white rounded-2xl p-4 sm:p-6 mb-8 shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-4">
                            <span class="bg-indigo-600 px-4 py-2 rounded-lg text-lg font-black tracking-wide">TEACHER</span>
                            <h2 class="text-2xl font-bold">제 ${currentRound} 라운드 <span class="text-gray-400 font-normal ml-2">총 ${allGroupsData.length}모둠 접속중</span></h2>
                        </div>
                        <div class="flex flex-wrap gap-3">
                            ${!isRevealed 
                                ? `<button onclick="handleRevealResults()" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-black py-3 px-6 rounded-xl text-lg shadow-md">결과 집계 및 공개 📊</button>`
                                : `<button onclick="handleNextRound()" class="bg-green-500 hover:bg-green-600 text-white font-black py-3 px-6 rounded-xl text-lg shadow-md">다음 라운드 시작 ➔</button>`
                            }
                            <button onclick="handleResetGame()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl text-lg shadow-md ml-4">전체 초기화</button>
                        </div>
                    </div>
                    ${boardHTML}
                </div>
            `;
        }

        function renderUI() {
            // 학생이 입력창에 타이핑 중일 때 UI가 새로고침되어 포커스를 잃는 것을 방지
            let currentInputVal = null;
            const existingInput = document.getElementById('bidInput');
            if (existingInput && document.activeElement === existingInput) {
                currentInputVal = existingInput.value;
            }

            let html = '';
            
            if (!isFirebaseReady) {
                html = getNeedsSetupView();
            } else if (currentMode === 'select') {
                html = getSelectView();
            } else if (currentMode === 'student') {
                html = getStudentView();
            } else if (currentMode === 'teacher') {
                html = getTeacherView();
            }

            appContainer.innerHTML = html;

            // 포커스 복원
            if (currentInputVal !== null) {
                const newInput = document.getElementById('bidInput');
                if (newInput) {
                    newInput.value = currentInputVal;
                    newInput.focus();
                }
            }

            // 수식 렌더링
            setTimeout(renderMath, 50);
        }

        // 앱 시작
        window.onload = () => {
            renderUI();
            if (isFirebaseReady) {
                setupFirebaseListeners();
            }
        };
    </script>
</body>
</html>
