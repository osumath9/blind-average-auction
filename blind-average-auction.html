<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평균 활용 경매 게임</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX CSS & JS for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        /* 기본 폰트 및 부드러운 스크롤 */
        @font-face {
            font-family: 'Pretendard-Regular';
            src: url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
        }
        body { font-family: 'Pretendard-Regular', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        
        /* 트랜지션 효과 */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* 팝업 모달 백그라운드 */
        .modal-bg { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 메인 컨테이너 (여기에 모든 뷰가 렌더링됨) -->
    <div id="app" class="flex-grow flex flex-col relative w-full h-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- 뷰 렌더링 영역 -->
    </div>

    <!-- 커스텀 토스트 알림창 (alert 대체) -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-lg">
        알림 메시지
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, getDocs, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 선생님께서 제공해주신 파이어베이스 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDTJw9QJ93KRajfZ4uZ9d1Qtn_RjttZJJ8",
            authDomain: "blind-average-auction.firebaseapp.com",
            projectId: "blind-average-auction",
            storageBucket: "blind-average-auction.firebasestorage.app",
            messagingSenderId: "596955232912",
            appId: "1:596955232912:web:8683c5fcf358ad7c10b615"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 앱 상수 설정
        const GAME_APP_ID = "blind-average-auction"; // 데이터 격리를 위한 ID
        const INITIAL_BALANCE = 10000000; // 천만 원
        const TOTAL_ROUNDS = 5;

        // 전역 상태 변수
        let currentMode = 'entry'; // 'entry', 'student', 'teacher'
        let userId = null;
        let myGroupInfo = null; // 학생용 본인 정보
        
        let globalGameState = {
            round: 1,
            phase: 'bidding' // 'bidding' (입찰 중), 'revealed' (결과 공개)
        };
        let allGroupsData = []; // 전체 모둠 데이터 (교사용 및 연산용)

        // DOM 요소
        const appContainer = document.getElementById('app');
        const toastEl = document.getElementById('toast');


        // 알림창 띄우기
        function showToast(message, isError = false) {
            toastEl.textContent = message;
            toastEl.style.backgroundColor = isError ? '#ef4444' : '#1f2937'; // 에러면 빨간색
            toastEl.style.opacity = '1';
            setTimeout(() => { toastEl.style.opacity = '0'; }, 3000);
        }

        // 숫자 포맷 (원 단위)
        function formatMoney(num) {
            return Number(num).toLocaleString('ko-KR');
        }

        // 수식 렌더링 헬퍼
        function renderMath() {
            renderMathInElement(appContainer, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '\\[', right: '\\]', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false}
                ],
                throwOnError: false
            });
        }

        // Firestore 경로 헬퍼 (규칙 준수)
        function getGameStateRef() {
            return doc(db, 'artifacts', GAME_APP_ID, 'public', 'data', 'gameState', 'current');
        }
        function getGroupsColRef() {
            return collection(db, 'artifacts', GAME_APP_ID, 'public', 'data', 'groups');
        }


        // 1. 익명 로그인 대신 로컬 스토리지를 활용하여 고유 기기 ID 부여
        function initSession() {
            try {
                let storedUserId = localStorage.getItem(GAME_APP_ID + '_userId');
                if (!storedUserId) {
                    // 기기별 랜덤 고유 ID 생성
                    storedUserId = 'group_' + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
                    localStorage.setItem(GAME_APP_ID + '_userId', storedUserId);
                }
                userId = storedUserId;
                setupFirebaseListeners();
                checkExistingSession();
            } catch (error) {
                console.error("Session error:", error);
                showToast("세션 생성에 실패했습니다. 브라우저 설정을 확인해주세요.", true);
            }
        }

        // 2. 파이어베이스 실시간 구독 설정
        function setupFirebaseListeners() {
            if (!userId) return;

            // 게임 상태 구독
            onSnapshot(getGameStateRef(), (docSnap) => {
                if (docSnap.exists()) {
                    globalGameState = docSnap.data();
                    renderUI(); // 상태 변경 시 UI 다시 그리기
                } else {
                    // 최초 게임 상태 생성 (선생님이 안 만들었을 경우 대비)
                    setDoc(getGameStateRef(), { round: 1, phase: 'bidding' }).catch(error => {
                        console.warn("초기 게임 상태 동기화 지연(네트워크 연결 대기 중):", error);
                    });
                }
            }, (error) => console.error("GameState sync error", error));

            // 모든 모둠 데이터 구독
            onSnapshot(getGroupsColRef(), (snapshot) => {
                const groups = [];
                snapshot.forEach((doc) => {
                    groups.push({ id: doc.id, ...doc.data() });
                });
                
                // 가입 순서(시간) 또는 이름순 정렬
                groups.sort((a, b) => a.name.localeCompare(b.name));
                allGroupsData = groups;
                
                // 내 모둠 정보 업데이트
                const myData = groups.find(g => g.id === userId);
                if (myData) {
                    myGroupInfo = myData;
                }
                renderUI();
            }, (error) => console.error("Groups sync error", error));
        }

        // 3. 기존 세션 확인 (새로고침 시 학생 화면 유지)
        async function checkExistingSession() {
            if (!userId) return;
            try {
                const myGroupDoc = await getDoc(doc(getGroupsColRef(), userId));
                if (myGroupDoc.exists()) {
                    currentMode = 'student';
                }
            } catch (error) {
                console.warn("데이터베이스 연결 실패 (네트워크 오프라인 등):", error);
                // 오프라인이더라도 앱이 멈추지 않고 초기 진입 화면을 보여주도록 처리
            } finally {
                renderUI();
            }
        }


        // [학생] 모둠 참여
        window.handleJoinGroup = async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('groupNameInput').value.trim();
            if (!nameInput) {
                showToast("모둠장 이름을 입력해주세요.", true);
                return;
            }
            if (!userId) return;

            try {
                await setDoc(doc(getGroupsColRef(), userId), {
                    name: nameInput,
                    balance: INITIAL_BALANCE,
                    bids: {} // 라운드별 입찰 기록
                });
                currentMode = 'student';
                showToast(`환영합니다, ${nameInput} 모둠!`);
                renderUI();
            } catch (error) {
                console.error(error);
                showToast("참여 중 오류가 발생했습니다.", true);
            }
        };

        // [학생] 입찰 제출
        window.handleBidSubmit = async (e) => {
            e.preventDefault();
            const bidInputStr = document.getElementById('bidInput').value;
            const bidAmount = parseInt(bidInputStr, 10);
            const currentRound = globalGameState.round;

            if (isNaN(bidAmount) || bidAmount < 0) {
                showToast("올바른 금액을 입력하세요.", true);
                return;
            }
            if (bidAmount > myGroupInfo.balance) {
                showToast("남은 예산을 초과할 수 없습니다!", true);
                return;
            }

            try {
                // 입찰액만큼 무조건 차감 (매몰 비용)
                const newBalance = myGroupInfo.balance - bidAmount;
                const newBids = { ...myGroupInfo.bids, [currentRound]: bidAmount };
                
                await updateDoc(doc(getGroupsColRef(), userId), {
                    balance: newBalance,
                    bids: newBids
                });
                showToast(`${currentRound}라운드 입찰이 완료되었습니다.`);
            } catch (error) {
                console.error(error);
                showToast("입찰 제출 실패", true);
            }
        };

        // [교사] 로그인 비밀번호 체크
        window.checkTeacherAuth = () => {
            const pw = prompt("관리자 비밀번호를 입력하세요.");
            if (pw === '13579') {
                currentMode = 'teacher';
                renderUI();
                showToast("교사 모드로 접속되었습니다.");
            } else if (pw !== null) {
                showToast("비밀번호가 틀렸습니다.", true);
            }
        };

        // [교사] 라운드 결과 공개 (평균 계산)
        window.handleRevealResults = async () => {
            try {
                await updateDoc(getGameStateRef(), { phase: 'revealed' });
            } catch (error) {
                console.error("결과 공개 통신 에러:", error);
                showToast("네트워크 연결이 원활하지 않습니다.", true);
            }
        };

        // [교사] 다음 라운드 진행
        window.handleNextRound = async () => {
            if (globalGameState.round >= TOTAL_ROUNDS) {
                showToast("이미 마지막 라운드입니다.");
                return;
            }
            try {
                await updateDoc(getGameStateRef(), { 
                    round: globalGameState.round + 1,
                    phase: 'bidding'
                });
            } catch (error) {
                console.error("다음 라운드 진행 통신 에러:", error);
                showToast("네트워크 연결이 원활하지 않습니다.", true);
            }
        };

        // [교사] 게임 전체 초기화
        window.handleResetGame = async () => {
            if (!confirm("정말 모든 데이터를 초기화하시겠습니까?\n모든 모둠의 정보와 돈이 초기화됩니다.")) return;
            
            try {
                // 게임 상태 초기화
                await setDoc(getGameStateRef(), { round: 1, phase: 'bidding' });
                
                // 모든 그룹 돈 초기화 및 입찰 기록 삭제
                const batch = writeBatch(db);
                allGroupsData.forEach(group => {
                    const ref = doc(getGroupsColRef(), group.id);
                    batch.update(ref, { balance: INITIAL_BALANCE, bids: {} });
                });
                await batch.commit();
                
                showToast("게임이 완전히 초기화되었습니다.");
            } catch (error) {
                console.error(error);
                showToast("초기화 실패", true);
            }
        };



        // 진입 화면 렌더링 (학생 중심)
        function getEntryView() {
            return `
                <!-- 우측 상단 교사 숨김 버튼 -->
                <button onclick="checkTeacherAuth()" class="absolute top-2 right-2 text-gray-300 hover:text-gray-500 opacity-30 hover:opacity-100 transition-opacity p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </button>

                <div class="flex-grow flex items-center justify-center fade-in">
                    <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl w-full max-w-md text-center border-t-8 border-blue-500">
                        <h1 class="text-4xl font-extrabold text-gray-800 mb-2 tracking-tight">평균 경매 게임</h1>
                        <p class="text-gray-500 mb-8 text-lg">주어진 예산으로 평균을 맞춰보세요!</p>
                        
                        <form onsubmit="handleJoinGroup(event)" class="space-y-6">
                            <div>
                                <label class="block text-left text-sm font-semibold text-gray-700 mb-2">우리 모둠장 이름</label>
                                <input type="text" id="groupNameInput" class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl text-xl text-center focus:outline-none focus:ring-4 focus:ring-blue-200 transition-all" placeholder="이름을 입력하세요" autocomplete="off" required>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1">
                                게임 입장하기
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        // 학생 화면 렌더링
        function getStudentView() {
            if (!myGroupInfo) return `<div class="flex-grow flex items-center justify-center text-2xl animate-pulse">데이터를 불러오는 중...</div>`;

            const currentRound = globalGameState.round;
            const currentPhase = globalGameState.phase;
            const hasBid = myGroupInfo.bids[currentRound] !== undefined;

            let mainContent = '';

            if (currentPhase === 'bidding') {
                if (hasBid) {
                    mainContent = `
                        <div class="bg-gray-50 rounded-2xl p-10 text-center border border-gray-200 shadow-inner">
                            <div class="inline-block p-4 rounded-full bg-green-100 text-green-500 mb-4">
                                <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <h2 class="text-3xl font-bold text-gray-800 mb-4">입찰 완료!</h2>
                            <p class="text-xl text-gray-600">제출한 금액: <strong class="text-blue-600">${formatMoney(myGroupInfo.bids[currentRound])}원</strong></p>
                            <p class="mt-6 text-gray-500">다른 모둠이 입찰을 마칠 때까지 기다려주세요.</p>
                        </div>
                    `;
                } else {
                    mainContent = `
                        <form onsubmit="handleBidSubmit(event)" class="bg-white rounded-2xl p-6 sm:p-10 shadow-lg border border-gray-100">
                            <div class="mb-8">
                                <label class="block text-gray-700 font-bold mb-4 text-2xl">이 라운드에 얼마를 입찰하시겠습니까?</label>
                                <div class="relative">
                                    <input type="number" id="bidInput" class="w-full px-6 py-5 bg-gray-50 border-2 border-blue-200 rounded-xl text-3xl font-bold text-right text-gray-800 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all pr-12" placeholder="0" min="0" max="${myGroupInfo.balance}" required>
                                    <span class="absolute right-6 top-1/2 transform -translate-y-1/2 text-2xl text-gray-500 font-bold">원</span>
                                </div>
                                <p class="text-right mt-3 text-red-500 font-medium">⚠️ 주의: 입찰한 금액은 낙찰 여부와 관계없이 차감됩니다.</p>
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-extrabold py-5 rounded-xl text-2xl shadow-xl transition-all transform hover:-translate-y-1">
                                입찰 제출하기
                            </button>
                        </form>
                    `;
                }
            } else if (currentPhase === 'revealed') {
                mainContent = `
                    <div class="bg-indigo-50 rounded-2xl p-10 text-center border border-indigo-200 shadow-md">
                        <div class="animate-bounce mb-6 text-indigo-500">
                            <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </div>
                        <h2 class="text-3xl font-bold text-indigo-900 mb-4">결과가 공개되었습니다!</h2>
                        <p class="text-2xl text-indigo-700 font-medium">선생님 화면을 주목해 주세요.</p>
                    </div>
                `;
            }

            return `
                <div class="flex-grow flex flex-col fade-in max-w-2xl mx-auto w-full">
                    <!-- 헤더 -->
                    <div class="flex justify-between items-end mb-8 border-b-2 border-gray-200 pb-4">
                        <div>
                            <p class="text-gray-500 font-bold mb-1">모둠 이름</p>
                            <h2 class="text-3xl font-black text-gray-800">${myGroupInfo.name} 모둠</h2>
                        </div>
                        <div class="text-right">
                            <p class="text-gray-500 font-bold mb-1">우리 모둠 남은 돈</p>
                            <h2 class="text-4xl font-black ${myGroupInfo.balance > 0 ? 'text-green-600' : 'text-red-500'}">${formatMoney(myGroupInfo.balance)}원</h2>
                        </div>
                    </div>

                    <!-- 라운드 정보 -->
                    <div class="text-center mb-8">
                        <span class="inline-block bg-blue-100 text-blue-800 font-black px-6 py-2 rounded-full text-xl shadow-sm border border-blue-200">
                            현재 ${currentRound} / ${TOTAL_ROUNDS} 라운드
                        </span>
                    </div>

                    <!-- 메인 액션 영역 -->
                    ${mainContent}
                </div>
            `;
        }

        // 교사 화면 렌더링
        function getTeacherView() {
            const currentRound = globalGameState.round;
            const isRevealed = globalGameState.phase === 'revealed';

            // 이번 라운드 입찰 데이터 집계
            let bidsThisRound = [];
            let sumBids = 0;
            
            allGroupsData.forEach(g => {
                const b = g.bids[currentRound];
                if (b !== undefined) {
                    bidsThisRound.push({ name: g.name, bid: b });
                    sumBids += b;
                } else {
                    bidsThisRound.push({ name: g.name, bid: null }); // 미입찰
                }
            });

            // 평균 계산 (참여 모둠이 있을 경우에만, 소수점 첫째 자리 반올림)
            const numBidders = bidsThisRound.filter(g => g.bid !== null).length;
            const average = numBidders > 0 ? Math.round(sumBids / numBidders) : 0;

            // 결과 공개 시 보여줄 표 생성
            let tableHTML = '';
            if (isRevealed) {
                // 입찰액 기준 내림차순 정렬 (보기 좋게)
                const sortedBids = [...bidsThisRound].sort((a, b) => (b.bid || 0) - (a.bid || 0));

                tableHTML = `
                    <div class="overflow-hidden rounded-2xl shadow-xl border border-gray-200 bg-white">
                        <table class="min-w-full text-center">
                            <thead class="bg-gray-800 text-white font-bold text-2xl">
                                <tr>
                                    <th class="py-5 px-6">모둠명</th>
                                    <th class="py-5 px-6">제출한 입찰액 ($x$)</th>
                                    <th class="py-5 px-6 bg-indigo-800">평균과의 차이 ($|x - m|$)</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200 text-xl text-gray-800">
                `;
                
                sortedBids.forEach(g => {
                    if (g.bid === null) {
                        tableHTML += `<tr class="bg-gray-50"><td class="py-4 font-bold text-gray-500">${g.name}</td><td colspan="2" class="py-4 text-gray-400">입찰하지 않음</td></tr>`;
                    } else {
                        const diff = Math.abs(g.bid - average);
                        tableHTML += `
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="py-5 font-black text-gray-700">${g.name}</td>
                                <td class="py-5 font-medium">${formatMoney(g.bid)}원</td>
                                <td class="py-5 font-black text-indigo-600 text-2xl">
                                    $$| ${formatMoney(g.bid)} - ${formatMoney(average)} | = ${formatMoney(diff)}$$
                                </td>
                            </tr>
                        `;
                    }
                });
                tableHTML += `</tbody></table></div>`;
            } else {
                // 입찰 진행 중 상태 표시
                tableHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        ${bidsThisRound.map(g => `
                            <div class="bg-white rounded-2xl p-6 shadow-md border-2 ${g.bid !== null ? 'border-green-400 bg-green-50' : 'border-gray-200'} flex flex-col items-center justify-center transition-all">
                                <div class="text-2xl font-bold mb-3 ${g.bid !== null ? 'text-green-800' : 'text-gray-600'}">${g.name}</div>
                                ${g.bid !== null 
                                    ? `<span class="px-4 py-1 bg-green-200 text-green-800 rounded-full font-bold">입력 완료</span>`
                                    : `<span class="px-4 py-1 bg-gray-100 text-gray-500 rounded-full font-bold flex items-center"><svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 고민 중...</span>`
                                }
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            return `
                <div class="flex-grow flex flex-col fade-in w-full">
                    <!-- 교사용 상단 컨트롤 바 -->
                    <div class="bg-gray-800 text-white rounded-2xl p-4 sm:p-6 mb-8 shadow-lg flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-4">
                            <span class="bg-blue-600 px-5 py-2 rounded-xl text-xl font-black shadow-inner">교사 패널</span>
                            <h2 class="text-2xl font-bold text-gray-200">현재 ${currentRound} 라운드</h2>
                        </div>
                        <div class="flex flex-wrap gap-3">
                            ${!isRevealed 
                                ? `<button onclick="handleRevealResults()" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-black py-3 px-6 rounded-xl text-lg shadow-md transition-transform transform hover:scale-105">결과 집계 및 공개</button>`
                                : `<button onclick="handleNextRound()" class="bg-green-500 hover:bg-green-600 text-white font-black py-3 px-6 rounded-xl text-lg shadow-md transition-transform transform hover:scale-105">다음 라운드 진행 ➔</button>`
                            }
                            <button onclick="handleResetGame()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl text-lg shadow-md transition-colors ml-4">전체 초기화</button>
                        </div>
                    </div>

                    <!-- 메인 보드 -->
                    ${isRevealed ? `
                        <div class="bg-white rounded-3xl p-8 shadow-2xl border-4 border-indigo-100 mb-8 text-center animate-[fadeIn_0.5s_ease-out]">
                            <h3 class="text-3xl text-gray-600 font-bold mb-4">현재 라운드 제출 평균 가격 ($m$)</h3>
                            <div class="text-4xl text-gray-500 mb-6 font-medium">
                                $$m = \\frac{\\text{입찰액의 총합}}{\\text{참여 모둠 수}} = \\frac{${formatMoney(sumBids)}}{${numBidders}}$$
                            </div>
                            <div class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 drop-shadow-md py-4">
                                ${formatMoney(average)} 원
                            </div>
                        </div>
                    ` : `
                        <div class="bg-blue-50 rounded-3xl p-8 shadow-inner border-2 border-blue-100 mb-8 text-center">
                            <h3 class="text-4xl text-blue-900 font-black mb-2">학생들이 입찰을 진행 중입니다...</h3>
                            <p class="text-xl text-blue-700">모든 모둠이 입찰을 완료하면 위 '결과 집계 및 공개' 버튼을 눌러주세요.</p>
                        </div>
                    `}

                    <!-- 데이터 표시 영역 -->
                    ${tableHTML}
                </div>
            `;
        }


        function renderUI() {
            let html = '';
            
            if (currentMode === 'entry') {
                html = getEntryView();
            } else if (currentMode === 'student') {
                html = getStudentView();
            } else if (currentMode === 'teacher') {
                html = getTeacherView();
            }

            appContainer.innerHTML = html;

            // DOM 갱신 후 KaTeX 수식 렌더링 실행
            setTimeout(renderMath, 50);
        }

        // 초기 실행
        window.onload = () => {
            renderUI();
            initSession();
        };

    </script>
</body>
</html>
